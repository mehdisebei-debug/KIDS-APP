name: CI

on:
  pull_request:
  push:
    branches: [main]

# Empêche deux runs concurrents sur la même branche (le dernier push gagne).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      # Le build ne dépend d'aucun secret : les pages qui lisent Supabase sont
      # en force-dynamic et createServerClient() renvoie null si l'env manque.
      - name: Build
        run: npm run build
